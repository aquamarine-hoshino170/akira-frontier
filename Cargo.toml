[package]
name = "akira-frontier"
version = "2.0.0"
edition = "2021"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
clap = { version = "4.4", features = ["derive"] }
dashmap = "5.5"
hex = "0.4"
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
