name: Akira-Frontier Dual Cloud Engine (Drive + HF)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */5 * * *'  # প্রতি ৫ ঘণ্টা পর পর অটো-স্টার্ট হবে (24/7 Infinite Cycle)

jobs:
  run-dual-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Toolchain & Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd rclone
          pip install huggingface_hub

      - name: Configure Rclone for Google Drive
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf

      - name: Build Optimized Release Binary
        run: |
          cargo build --release

      - name: Run Engine & Dual Push (Google Drive + Hugging Face)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ./target/release/akira-frontier --universes 4 > engine_run.log 2>&1 &
          echo "[+] Akira-Frontier Engine launched in GitHub Cloud."

          python3 - << 'PYEOF'
          import os, time, subprocess
          from huggingface_hub import HfApi

          raw_token = os.environ.get("HF_TOKEN", "")
          hf_token = raw_token.strip() if raw_token else None

          REPO_ID = "aquamarine-hoshino170/akira-frontier-115d"
          TARGET_FILE = "found.jsonl"
          DRIVE_REMOTE = "aqua:AkiraBackup/chunks"
          THRESHOLD = 50 * 1024 * 1024

          os.makedirs("chunks_out", exist_ok=True)
          start_time = time.time()

          while time.time() - start_time < 18000: # ৫ ঘণ্টা একটানা চলবে
              if os.path.exists(TARGET_FILE):
                  size = os.path.getsize(TARGET_FILE)
                  if size >= THRESHOLD:
                      ts = time.strftime("%Y%m%d_%H%M%S")
                      snap = f"snap_{ts}.jsonl"
                      zst_file = f"chunks_out/chunk_{ts}.tar.zst"

                      os.rename(TARGET_FILE, snap)
                      open(TARGET_FILE, 'a').close()
                      subprocess.run(f"tar -cf - {snap} | zstd -19 -o {zst_file}", shell=True)
                      os.remove(snap)

                      subprocess.run(f"rclone copy {zst_file} {DRIVE_REMOTE}/", shell=True)

                      if hf_token:
                          try:
                              api = HfApi(token=hf_token)
                              api.upload_file(
                                  path_or_fileobj=zst_file,
                                  path_in_repo=f"chunks/chunk_{ts}.tar.zst",
                                  repo_id=REPO_ID,
                                  repo_type="dataset"
                              )
                          except Exception as ex:
                              print(f"HF Error: {ex}")

                      os.remove(zst_file)
              time.sleep(30)
          PYEOF
